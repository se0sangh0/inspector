<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스프라이트 재생 미리보기</title>
<style>
  :root { color-scheme: dark; --ink:#e8e4dc; --dim:#9aa0a8; --line:#39414d; --brass:#c39a52; --bg:#14171d; --panel:#1b1f27; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.6 "Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; gap:14px; align-items:baseline; flex-wrap:wrap; }
  h1 { margin:0; font-size:16px; letter-spacing:.02em; }
  .warn { color:var(--brass); font-size:12px; }
  main { display:grid; grid-template-columns:260px minmax(0,1fr); gap:0; min-height:calc(100vh - 56px); }
  #list { border-right:1px solid var(--line); padding:10px; overflow:auto; max-height:calc(100vh - 56px); }
  #list button { display:block; width:100%; text-align:left; margin-bottom:4px; padding:8px 10px;
                 background:transparent; border:1px solid transparent; border-radius:3px;
                 color:var(--dim); font:inherit; cursor:pointer; }
  #list button:hover { border-color:var(--line); color:var(--ink); }
  #list button[aria-current="true"] { color:var(--brass); border-color:var(--brass); background:rgb(195 154 82 / .1); }
  #list .group { margin:14px 0 6px; padding:0 10px; color:#c0554e; font-size:11px;
                 letter-spacing:.08em; border-top:1px solid var(--line); padding-top:10px; }
  #list button.pending { color:#8a6b66; font-style:italic; }
  #list button.pending::after { content:" · 미등록"; font-size:11px; font-style:normal; opacity:.8; }
  #stage { padding:18px 20px; display:flex; flex-direction:column; gap:14px; min-width:0; }
  .controls { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .controls button, .controls select { min-height:34px; padding:0 12px; background:var(--panel);
        color:var(--ink); border:1px solid var(--line); border-radius:3px; font:inherit; cursor:pointer; }
  .controls button:hover:not(:disabled) { border-color:var(--brass); color:var(--brass); }
  .controls button:disabled { opacity:.4; cursor:not-allowed; }
  .controls label { color:var(--dim); font-size:12px; display:inline-flex; gap:6px; align-items:center; }
  .viewport { border:1px solid var(--line); overflow:auto; padding:16px; display:flex;
              justify-content:center; align-items:center; min-height:320px; }
  .viewport[data-bg="light"] { background:#d9d6d0; }
  .viewport[data-bg="dark"]  { background:#0c0e12; }
  .viewport[data-bg="checker"] {
      background-color:#8b8f96;
      background-image:
        linear-gradient(45deg,#6f747c 25%,transparent 25%,transparent 75%,#6f747c 75%),
        linear-gradient(45deg,#6f747c 25%,transparent 25%,transparent 75%,#6f747c 75%);
      background-size:24px 24px; background-position:0 0,12px 12px; }
  canvas { image-rendering:pixelated; display:block; }
  .meta { color:var(--dim); font-size:12px; display:flex; gap:18px; flex-wrap:wrap; }
  .meta b { color:var(--ink); font-weight:600; }
  .meta .verdict { padding:1px 8px; border:1px solid var(--brass); border-radius:2px; color:var(--brass); }
  .meta .verdict b { color:var(--brass); }
  #err { color:#e07a6a; }
</style>
</head>
<body>
<header>
  <h1>스프라이트 재생 미리보기</h1>
  <span class="warn" id="src"></span>
</header>
<main>
  <nav id="list" aria-label="애니메이션 목록"></nav>
  <section id="stage">
    <div class="controls">
      <button id="play">재생</button>
      <button id="prev">◀ 이전</button>
      <button id="next">다음 ▶</button>
      <label>속도
        <select id="speed">
          <option value="0.25">0.25×</option><option value="0.5">0.5×</option>
          <option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option>
        </select>
      </label>
      <label>확대
        <select id="zoom"><option value="1">1×</option><option value="2" selected>2×</option><option value="4">4×</option></select>
      </label>
      <label>배경
        <select id="bg"><option value="checker" selected>체크무늬</option><option value="dark">어두움</option><option value="light">밝음</option></select>
      </label>
      <label><input type="checkbox" id="pivot" checked> 기준점</label>
      <label><input type="checkbox" id="grid"> 프레임 테두리</label>
    </div>
    <div class="viewport" id="viewport" data-bg="checker"><canvas id="cv" width="384" height="512"></canvas></div>
    <div class="meta" id="meta"></div>
    <div id="err"></div>
  </section>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');
  let manifest = null, anim = null, img = null;
  let frame = 0, playing = false, rafId = 0, lastTs = 0, acc = 0;

  const fail = m => { $('err').textContent = m; };

  function draw() {
    if (!anim || !img) return;
    const [cw, ch] = anim.cell, z = +$('zoom').value;
    cv.width = cw * z; cv.height = ch * z;
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, cv.width, cv.height);
    const col = frame % anim.cols, row = Math.floor(frame / anim.cols);
    ctx.drawImage(img, col * cw, row * ch, cw, ch, 0, 0, cw * z, ch * z);
    if ($('grid').checked) {
      ctx.strokeStyle = 'rgba(195,154,82,.55)'; ctx.lineWidth = 1;
      ctx.strokeRect(0.5, 0.5, cv.width - 1, cv.height - 1);
    }
    if ($('pivot').checked && anim.pivot) {
      const [px, py] = anim.pivot, x = px * z, y = py * z;
      ctx.strokeStyle = 'rgba(224,90,74,.95)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, cv.height);
      ctx.moveTo(0, y); ctx.lineTo(cv.width, y); ctx.stroke();
      ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.stroke();
    }
    const d = anim.durations[frame];
    $('meta').innerHTML =
      `<span>프레임 <b>${frame + 1} / ${anim.frameCount}</b></span>` +
      `<span>지속 <b>${d}ms</b></span>` +
      `<span>합계 <b>${anim.durations.reduce((a, b) => a + b, 0)}ms</b></span>` +
      `<span>칸 <b>${cw}×${ch}</b> · ${anim.cols}열 ${anim.rows}행</span>` +
      `<span>반복 <b>${anim.loop ? '예' : '아니오'}</b></span>` +
      `<span>알파 <b>${anim.hasAlpha ? '있음' : '없음'}</b></span>` +
      `<span>기준점 <b>${anim.pivot.join(', ')}</b> <i>(${anim.pivotSource})</i></span>` +
      (anim.status ? `<span class="verdict">${anim.status}</span>` : '');
  }

  function step(ts) {
    if (!playing) return;
    if (!lastTs) lastTs = ts;
    acc += (ts - lastTs) * (+$('speed').value);
    lastTs = ts;
    let guard = 0;
    while (anim && acc >= anim.durations[frame] && guard++ < 64) {
      acc -= anim.durations[frame];
      if (frame + 1 >= anim.frameCount) {
        if (anim.loop) frame = 0;
        else { setPlaying(false); frame = anim.frameCount - 1; draw(); return; }
      } else frame++;
    }
    draw();
    rafId = requestAnimationFrame(step);
  }

  function setPlaying(on) {
    // 프레임이 없는 항목에서는 재생 상태로 들어가지 않는다 — 빈 화면이
    // 재생 중인 것처럼 보이면 안 된다.
    if (on && !anim) on = false;
    // 반복하지 않는 모션이 끝까지 재생돼 마지막 프레임에 멈춰 있으면, 다시 재생을
    // 누를 때 처음으로 되감는다. 되감지 않으면 step 이 곧바로 종료 조건에 걸려
    // '일시정지'로 잠깐 바뀌었다가 그대로 멈춘다.
    let rewound = false;
    if (on && anim && !anim.loop && frame >= anim.frameCount - 1) { frame = 0; rewound = true; }
    playing = on; $('play').textContent = on ? '일시정지' : '재생';
    $('play').disabled = !anim;
    $('prev').disabled = !anim;
    $('next').disabled = !anim;
    cancelAnimationFrame(rafId); lastTs = 0; acc = 0;
    // 되감았으면 곧바로 한 번 그린다. 다음 rAF 를 기다리면 프레임 번호가
    // 잠시 옛 값(마지막 프레임)으로 남아 되감기지 않은 것처럼 보인다.
    if (rewound) draw();
    if (on) rafId = requestAnimationFrame(step);
  }

  function showPending(p, btn) {
    anim = null; img = null; setPlaying(false);
    [...$('list').children].forEach(b => b.setAttribute && b.setAttribute('aria-current', b === btn ? 'true' : 'false'));
    const z = +$('zoom').value;
    cv.width = 384 * z; cv.height = 240 * z;
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.strokeStyle = '#c0554e'; ctx.setLineDash([8, 6]); ctx.lineWidth = 2;
    ctx.strokeRect(6, 6, cv.width - 12, cv.height - 12);
    ctx.setLineDash([]);
    ctx.fillStyle = '#e8e4dc'; ctx.textAlign = 'center';
    ctx.font = `${13 * z}px system-ui, sans-serif`;
    ctx.fillText('이미지 미등록', cv.width / 2, cv.height / 2 - 8 * z);
    ctx.fillStyle = '#c0554e'; ctx.font = `${10 * z}px system-ui, sans-serif`;
    ctx.fillText(`목표 ${p.frameCount}프레임 · 프레임 파일 없음`, cv.width / 2, cv.height / 2 + 12 * z);
    ctx.textAlign = 'start';
    $('meta').innerHTML = `<span style="color:#e07a6a"><b>재생할 수 없습니다.</b> ${p.status}</span>`;
    $('err').textContent = '';
  }

  function select(a, btn) {
    anim = a; frame = 0; setPlaying(false);
    [...$('list').children].forEach(b => b.setAttribute('aria-current', b === btn ? 'true' : 'false'));
    img = new Image();
    img.onload = () => { $('err').textContent = ''; draw(); };
    img.onerror = () => fail(`시트를 불러오지 못했습니다: ${a.sheet}`);
    img.src = a.sheet;
  }

  ['zoom', 'bg', 'pivot', 'grid'].forEach(id => $(id).addEventListener('change', () => {
    $('viewport').dataset.bg = $('bg').value; draw();
  }));
  $('play').addEventListener('click', () => setPlaying(!playing));
  $('prev').addEventListener('click', () => { if (!anim) return; setPlaying(false); frame = (frame - 1 + anim.frameCount) % anim.frameCount; draw(); });
  $('next').addEventListener('click', () => { if (!anim) return; setPlaying(false); frame = (frame + 1) % anim.frameCount; draw(); });
  addEventListener('keydown', e => {
    if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }
    if (e.key === 'ArrowLeft') $('prev').click();
    if (e.key === 'ArrowRight') $('next').click();
  });

  fetch('manifest.json')
    .then(r => { if (!r.ok) throw new Error(`manifest.json ${r.status}`); return r.json(); })
    .then(m => {
      manifest = m;
      $('src').textContent = `${m.animations.length}개 · ${m.note}`;
      m.animations.forEach((a, i) => {
        const b = document.createElement('button');
        b.type = 'button'; b.textContent = a.label;
        b.setAttribute('aria-current', 'false');
        b.addEventListener('click', () => select(a, b));
        $('list').appendChild(b);
        if (i === 0) queueMicrotask(() => select(a, b));
      });

      const pending = m.pending || [];
      if (pending.length) {
        const h = document.createElement('p');
        h.className = 'group';
        h.textContent = `이미지 미등록 (${pending.length})`;
        $('list').appendChild(h);
        pending.forEach(p => {
          const b = document.createElement('button');
          b.type = 'button'; b.className = 'pending'; b.textContent = p.label;
          b.addEventListener('click', () => showPending(p, b));
          $('list').appendChild(b);
        });
      }
    })
    .catch(e => fail(`manifest.json 을 읽지 못했습니다 — 파일 프로토콜에서는 로컬 서버가 필요합니다. (${e.message})`));
})();
</script>
</body>
</html>
